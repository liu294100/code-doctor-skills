rules:
  # ========== 危险命令 - 始终询问 ==========
  - capability: shell
    match:
      # 递归删除
      - rm -rf *
      - rm -r -f *
      - rm -fr *
      - Remove-Item*-Recurse*-Force*
      - rmdir /s /q *
      - rmdir /s*
      - del /f /s /q *
      - del /f /s *
      - rd /s /q *
      # Git 危险操作
      - git push*--force*
      - git push*-f
      - git push * --force*
      - git push * -f
      - git reset --hard*
      - git clean -fd*
      - git clean -f*
      - git branch -D *
      - git checkout --orphan*
      - git filter-branch*
      - git rebase*--force*
      # 数据库危险操作
      - drop table*
      - drop database*
      - truncate table*
      - DELETE FROM*WHERE 1*
      - DELETE FROM*WHERE true*
      # 系统危险操作
      - format *:*
      - shutdown*
      - reboot*
      - halt*
      - poweroff*
      - init 0*
      - init 6*
      - mkfs*
      - dd if=*
      - ":>/*"
      - "> /*"
      # 权限危险操作
      - chmod -R 777*
      - chmod 777 /*
      - chown -R*/*
      # 远程执行危险
      - "curl*| bash*"
      - "curl*| sh*"
      - "wget*| bash*"
      - "wget*| sh*"
      - "curl*|bash*"
      - "curl*|sh*"
      # 包管理危险操作
      - npm unpublish*
      - pip uninstall*-y*
      - gem uninstall*-a*
      # 容器/K8s 危险操作
      - docker system prune*-a*
      - docker volume prune*-f*
      - docker container prune*-f*
      - docker image prune*-a*
      - docker rm*-f*
      - docker rmi*-f*
      - kubectl delete*--all*
      - kubectl delete namespace*
      - kubectl delete ns *
      # 服务管理危险操作
      - systemctl stop*
      - systemctl disable*
      - systemctl mask*
      - service * stop*
      # 网络/防火墙危险操作
      - iptables -F*
      - iptables -X*
      - ufw disable*
      - firewall-cmd*--remove*
      # Windows 注册表危险操作
      - reg delete*
      - registry delete*
      - Remove-ItemProperty*
      # 环境变量危险操作
      - setx*PATH*
      - "[Environment]::SetEnvironmentVariable*Machine*"
    effect: ask

